<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mã QR Bó Hoa 20/10 · Gửi Em</title>
  <style>
    :root {
      --ink: #76364d;
      --rose: #c83e6b;
      --muted: #916674;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(circle at 50% 45%, #fff9fb 0%, #fce8ef 65%, #f8d7e3 100%);
      font-family: "Segoe UI", "Noto Sans", sans-serif;
      color: var(--ink);
    }
    .qr-page-card {
      width: min(100%, 500px);
      background: #ffffff;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 24px 64px rgba(198, 57, 104, 0.16);
      text-align: center;
    }
    h1 {
      margin: 0 0 6px;
      font: 600 22px/1.3 "Palatino Linotype", Georgia, serif;
      color: var(--rose);
    }
    .subtitle {
      margin: 0 0 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .canvas-wrap {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid #f3dce4;
      background: #fdf8f5;
      box-shadow: inset 0 0 20px rgba(200, 62, 107, 0.04);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .input-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e4bfd0;
      border-radius: 12px;
      font-size: 13px;
      color: var(--ink);
      background: #fff9fb;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    button, .back-link {
      padding: 11px 18px;
      border-radius: 24px;
      font: 600 13px/1.2 "Segoe UI", sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, background 0.2s;
    }
    .btn-primary {
      border: 0;
      background: linear-gradient(135deg, #d84374, #b82d5b);
      color: #fff;
      box-shadow: 0 6px 18px rgba(200, 62, 107, 0.28);
    }
    .btn-secondary {
      border: 1px solid #dcb8c5;
      background: #fff8fa;
      color: var(--ink);
    }
    button:hover, .back-link:hover { transform: translateY(-1px); }
    .status {
      min-height: 18px;
      margin: 6px 0 0;
      font-size: 12.5px;
      color: #c83e6b;
      font-weight: 500;
    }
    body.is-clean {
      padding: 0;
      margin: 0;
      background: transparent;
      overflow: hidden;
    }
    body.is-clean .qr-page-card {
      width: 100vw;
      height: 100vh;
      max-width: none;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
    }
    body.is-clean h1,
    body.is-clean .subtitle,
    body.is-clean .controls {
      display: none !important;
    }
    body.is-clean .canvas-wrap {
      width: 100vw;
      height: 100vh;
      border: 0;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <div class="qr-page-card">
    <h1>Mã QR Bó Hoa Đặc Biệt 20/10 🌸</h1>
    <p class="subtitle">Gửi ảnh QR này cho người yêu quét trên điện thoại nhé!</p>
    <div class="canvas-wrap">
      <canvas id="qrBouquetCanvas" width="1080" height="1080"></canvas>
    </div>
    <div class="controls">
      <div class="input-row">
        <input id="qrUrlInput" type="text" value="https://bryannlee202.github.io/20-10/" aria-label="Link mã QR">
        <input id="qrCaptionInput" type="text" value="Gửi em - ngày 20 tháng 10" aria-label="Dòng chữ trên bó hoa" style="max-width: 190px;">
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="downloadBtn" type="button">📥 Tải ảnh QR (PNG nét cao)</button>
        <button class="btn-secondary" id="copyImgBtn" type="button">📋 Copy ảnh dán vào Zalo/Mess</button>
        <a class="back-link btn-secondary" href="./index.html?from=garden">← Về trang Bó hoa</a>
      </div>
      <p class="status" id="qrStatus"></p>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('qrBouquetCanvas');
      const ctx = canvas.getContext('2d');
      const urlInput = document.getElementById('qrUrlInput');
      const captionInput = document.getElementById('qrCaptionInput');
      const status = document.getElementById('qrStatus');
      const params = new URLSearchParams(window.location.search);
      if (params.get('clean') === '1') {
        document.body.classList.add('is-clean');
      }
      if (params.get('url')) {
        urlInput.value = params.get('url');
      }

      function drawFlower(cx, cy, petals, rOuter, rInner, petalColor, centerColor, rotOffset = 0) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rotOffset);
        ctx.fillStyle = petalColor;
        for (let i = 0; i < petals; i++) {
          ctx.save();
          ctx.rotate((Math.PI * 2 * i) / petals);
          ctx.beginPath();
          ctx.ellipse(0, -rOuter * 0.58, rOuter * 0.34, rOuter * 0.56, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = centerColor;
        ctx.beginPath();
        ctx.arc(0, 0, rInner, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawLeafCluster(cx, cy, angle, scale, color = '#2e3856') {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.scale(scale, scale);
        ctx.fillStyle = color;
        [[-0.45, -36, 15, 36], [0.05, -48, 17, 44], [0.52, -34, 14, 34]].forEach(([rot, yOff, rx, ry]) => {
          ctx.save();
          ctx.rotate(rot);
          ctx.beginPath();
          ctx.ellipse(0, yOff, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
        ctx.restore();
      }

      function drawHalfDaisy(cx, cy, angle, scale) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.scale(scale, scale);
        // Pink fan petals
        ctx.fillStyle = '#f2a2ba';
        [-0.9, -0.45, 0, 0.45, 0.9].forEach(a => {
          ctx.save();
          ctx.rotate(a);
          ctx.beginPath();
          ctx.ellipse(0, 42, 15, 38, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
        // Navy dome core
        ctx.fillStyle = '#2e3856';
        ctx.beginPath();
        ctx.arc(0, 0, 32, Math.PI, 0, false);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      async function renderBouquetQR() {
        const targetUrl = urlInput.value.trim() || 'https://bryannlee202.github.io/20-10/';
        const captionText = captionInput.value.trim() || 'Gửi em - ngày 20 tháng 10';
        const W = 1080, H = 1080;
        ctx.clearRect(0, 0, W, H);

        // 1. Warm cream-blush card background with subtle vignette
        const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.45, 80, W * 0.5, H * 0.5, W * 0.72);
        bgGrad.addColorStop(0, '#fffdfb');
        bgGrad.addColorStop(0.7, '#fdf6f4');
        bgGrad.addColorStop(1, '#f9ebe8');
        roundRect(24, 24, W - 48, H - 48, 56);
        ctx.fillStyle = bgGrad;
        ctx.fill();

        // Subtle decorative outer border
        roundRect(44, 44, W - 88, H - 88, 42);
        ctx.strokeStyle = 'rgba(216, 148, 168, 0.25)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 2. Back peak of wrapping paper behind QR top
        ctx.fillStyle = '#e79bb2';
        ctx.beginPath();
        ctx.moveTo(540, 128);
        ctx.lineTo(660, 240);
        ctx.lineTo(420, 240);
        ctx.closePath();
        ctx.fill();

        // 3. Back botanical leaves & blossoms peeking around the bouquet
        drawLeafCluster(650, 210, 0.35, 1.15, '#2b3654');
        drawLeafCluster(255, 360, -0.78, 1.05, '#2b3654');
        drawLeafCluster(865, 390, 0.88, 1.15, '#2b3654');
        drawFlower(472, 172, 5, 42, 6, '#f4b0c4', '#2b3654', 0.2);
        drawFlower(825, 292, 5, 34, 5, '#2b3654', '#f4b0c4', 0.4);

        // Thin delicate arched wire frame around upper bouquet (like the reference image)
        ctx.save();
        ctx.strokeStyle = '#394463';
        ctx.lineWidth = 2.4;
        roundRect(306, 198, 468, 360, 82);
        ctx.stroke();
        ctx.restore();

        // 4. Left & Right Pastel Pink Bouquet Paper Folds wrapping around the QR
        // Left back wing
        ctx.fillStyle = '#f2b8c9';
        ctx.beginPath();
        ctx.moveTo(225, 390);
        ctx.quadraticCurveTo(320, 340, 390, 520);
        ctx.lineTo(540, 820);
        ctx.lineTo(340, 650);
        ctx.closePath();
        ctx.fill();

        // Right back wing
        ctx.fillStyle = '#eca6bc';
        ctx.beginPath();
        ctx.moveTo(855, 370);
        ctx.quadraticCurveTo(750, 330, 680, 520);
        ctx.lineTo(540, 820);
        ctx.lineTo(745, 650);
        ctx.closePath();
        ctx.fill();

        // 5. QR Card Frame in the center (White rounded box with double rose-gold & berry border)
        const qrBoxX = 338, qrBoxY = 212, qrBoxSize = 404;
        ctx.save();
        ctx.shadowColor = 'rgba(164, 48, 84, 0.16)';
        ctx.shadowBlur = 28;
        ctx.shadowOffsetY = 10;
        roundRect(qrBoxX, qrBoxY, qrBoxSize, qrBoxSize, 26);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();

        // Outer berry-rose border
        roundRect(qrBoxX, qrBoxY, qrBoxSize, qrBoxSize, 26);
        ctx.strokeStyle = '#c83e6b';
        ctx.lineWidth = 5;
        ctx.stroke();

        // Inner warm gold-peach border
        roundRect(qrBoxX + 7, qrBoxY + 7, qrBoxSize - 14, qrBoxSize - 14, 20);
        ctx.strokeStyle = '#f3c178';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Fetch and draw crisp QR code in rose-berry color (#c53b68)
        try {
          const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=700x700&ecc=H&margin=1&color=c53b68&bgcolor=ffffff&data=${encodeURIComponent(targetUrl)}`;
          const img = new Image();
          img.crossOrigin = 'anonymous';
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
            img.src = qrApiUrl;
          });
          ctx.drawImage(img, qrBoxX + 22, qrBoxY + 22, qrBoxSize - 44, qrBoxSize - 44);

          // Tiny cute center heart badge on QR code
          const cx = qrBoxX + qrBoxSize / 2;
          const cy = qrBoxY + qrBoxSize / 2;
          roundRect(cx - 26, cy - 26, 52, 52, 14);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.strokeStyle = '#f4b0c4';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          ctx.fillStyle = '#d83b6a';
          ctx.beginPath();
          const s = 14;
          ctx.moveTo(cx, cy + s * 0.75);
          ctx.bezierCurveTo(cx - s * 1.3, cy - s * 0.2, cx - s * 0.7, cy - s * 1.2, cx, cy - s * 0.35);
          ctx.bezierCurveTo(cx + s * 0.7, cy - s * 1.2, cx + s * 1.3, cy - s * 0.2, cx, cy + s * 0.75);
          ctx.fill();
        } catch (e) {
          status.textContent = 'Không tải được ảnh QR online, kiểm tra kết nối mạng nhé.';
        }

        // 6. Foreground Flowers tucked around the bottom & sides of the QR box
        // Left blossoms
        drawFlower(305, 385, 5, 44, 6, '#f4adc1', '#2b3654', 0.1);
        drawFlower(268, 438, 5, 24, 4, '#2b3654', '#f4adc1', 0.5);
        drawHalfDaisy(315, 456, 2.75, 0.72);
        drawFlower(348, 502, 5, 19, 3, '#f29eb6', '#ffffff', 0.2);

        // Right giant blooming pink daisy/echinacea
        drawHalfDaisy(822, 412, 0.55, 1.25);

        // Bottom blossoms right below QR frame
        drawLeafCluster(635, 650, 0.55, 0.85, '#2b3654');
        drawLeafCluster(520, 668, -0.35, 0.75, '#2b3654');
        drawFlower(598, 636, 5, 52, 6, '#f5b2c6', '#2b3654', 0.35);
        drawFlower(465, 636, 5, 24, 3.5, '#f29cb5', '#ffffff', 0.15);
        drawFlower(528, 682, 5, 26, 4, '#2b3654', '#f5b2c6', 0.4);

        // 7. Front Wrapping Paper Cone & Bottom Tail
        // Bottom bouquet tail
        ctx.fillStyle = '#ea9ab2';
        ctx.beginPath();
        ctx.moveTo(510, 825);
        ctx.lineTo(585, 825);
        ctx.lineTo(638, 955);
        ctx.lineTo(595, 962);
        ctx.lineTo(575, 995);
        ctx.lineTo(482, 942);
        ctx.closePath();
        ctx.fill();

        // Left front paper fold
        ctx.fillStyle = '#f5bdd0';
        ctx.beginPath();
        ctx.moveTo(260, 465);
        ctx.quadraticCurveTo(385, 650, 595, 835);
        ctx.lineTo(502, 845);
        ctx.quadraticCurveTo(335, 690, 260, 465);
        ctx.closePath();
        ctx.fill();

        // Right front main paper cone
        const coneGrad = ctx.createLinearGradient(350, 520, 790, 860);
        coneGrad.addColorStop(0, '#f7c4d4');
        coneGrad.addColorStop(0.55, '#f2aec3');
        coneGrad.addColorStop(1, '#e896b0');
        ctx.fillStyle = coneGrad;
        ctx.beginPath();
        ctx.moveTo(790, 455);
        ctx.quadraticCurveTo(685, 680, 588, 845);
        ctx.lineTo(498, 845);
        ctx.quadraticCurveTo(405, 680, 325, 540);
        ctx.quadraticCurveTo(490, 725, 635, 680);
        ctx.quadraticCurveTo(725, 575, 790, 455);
        ctx.closePath();
        ctx.fill();

        // 8. Frosted Banner & Italic Script Caption ("Gửi em - ngày 20 tháng 10")
        roundRect(340, 800, 400, 64, 14);
        ctx.fillStyle = 'rgba(255, 252, 251, 0.68)';
        ctx.fill();

        // Delicate Navy Line Bow tied at the waist of the bouquet
        ctx.save();
        ctx.strokeStyle = '#394463';
        ctx.lineWidth = 2.3;
        ctx.lineCap = 'round';
        // Left loop
        ctx.beginPath();
        ctx.moveTo(555, 825);
        ctx.bezierCurveTo(500, 770, 495, 855, 555, 825);
        // Right loop
        ctx.moveTo(555, 825);
        ctx.bezierCurveTo(610, 770, 615, 855, 555, 825);
        // Hanging ribbons
        ctx.moveTo(555, 825);
        ctx.quadraticCurveTo(530, 865, 535, 895);
        ctx.moveTo(555, 825);
        ctx.quadraticCurveTo(580, 865, 590, 888);
        ctx.stroke();
        ctx.restore();

        // Script text
        ctx.save();
        ctx.fillStyle = '#c84669';
        ctx.font = 'italic 36px "Palatino Linotype", "Book Antiqua", Georgia, serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(captionText, W / 2, 833);
        ctx.restore();
      }

      urlInput.addEventListener('input', renderBouquetQR);
      captionInput.addEventListener('input', renderBouquetQR);

      document.getElementById('downloadBtn').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'QR_Bo_Hoa_Tang_Em_20_10.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        status.textContent = '✨ Đã tải ảnh QR_Bo_Hoa_Tang_Em_20_10.png về máy!';
      });

      document.getElementById('copyImgBtn').addEventListener('click', () => {
        canvas.toBlob(async blob => {
          try {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            status.textContent = '💖 Đã copy ảnh QR! Bạn qua Zalo/Messenger bấm Ctrl+V để gửi cho người yêu nhé!';
          } catch {
            status.textContent = 'Trình duyệt chưa hỗ trợ copy trực tiếp, bạn bấm nút Tải ảnh QR bên cạnh nhé!';
          }
        }, 'image/png');
      });

      renderBouquetQR();
    })();
  </script>
</body>
</html>
